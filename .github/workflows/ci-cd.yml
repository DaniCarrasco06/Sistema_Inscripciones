name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Login Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Construir imagen Docker
        working-directory: ./SistemaDeInscripcion/SistemaDeInscripcion
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/sistema-inscripcion:latest .
        
      - name: Subir imagen Docker
        run: docker push ${{ secrets.DOCKER_USERNAME }}/sistema-inscripcion:latest
